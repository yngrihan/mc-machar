<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MC MACHAR</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #ffffff; font-family: Arial, Helvetica, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    #menu { position: fixed; inset: 0; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; z-index: 10; padding: 20px; text-align: center; }
    #menuFace { max-width: 150px; max-height: 150px; width: auto; height: auto; border-radius: 16px; border: 3px solid #111; object-fit: cover; }
    #menu h1 { margin: 0; font-size: 42px; letter-spacing: 2px; color: #111; }
    #playBtn { background: #ffd400; color: #111; border: 3px solid #111; border-radius: 14px; padding: 14px 38px; font-size: 24px; font-weight: 800; cursor: pointer; }
    #hud { position: fixed; top: 18px; left: 0; right: 0; display: none; flex-direction: column; align-items: center; pointer-events: none; z-index: 5; }
    #kills { font-size: 38px; font-weight: 900; color: #111; line-height: 1.05; }
    #killsLabel { font-size: 13px; font-weight: 800; letter-spacing: 1px; color: #111; margin-top: 2px; }
    #closeBtn { position: fixed; top: 18px; left: 18px; z-index: 6; display: none; width: 46px; height: 46px; border-radius: 50%; border: none; background: #8e8e93; color: #fff; font-size: 22px; font-weight: bold; cursor: pointer; }
    #pauseBtn { position: fixed; top: 18px; right: 18px; z-index: 6; display: none; width: 52px; height: 52px; border-radius: 12px; border: none; background: #2c2f36; color: #fff; font-size: 20px; font-weight: bold; cursor: pointer; }
    #pauseOverlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 15; }
    #pauseOverlay button { padding: 12px 28px; font-size: 20px; font-weight: 800; border-radius: 12px; border: 2px solid #111; cursor: pointer; background: #ffd400; color: #111; }
  </style>
</head>
<body>
  <div id="menu">
    <img id="menuFace" src="face.png" alt="MC MACHAR" />
    <h1>MC MACHAR</h1>
    <button id="playBtn">PLAY</button>
    <div style="font-size: 14px; color: #333;">Hold &amp; Drag to aim • Release to shoot</div>
  </div>
  <button id="closeBtn">✕</button>
  <div id="hud">
    <div id="kills">0</div>
    <div id="killsLabel">TOTAL KILLS</div>
  </div>
  <button id="pauseBtn">II</button>
  <div id="pauseOverlay">
    <button id="resumeBtn">RESUME</button>
    <button id="restartBtn" style="background:#fff;">RESTART</button>
  </div>
  <canvas id="gameCanvas"></canvas>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const menuEl = document.getElementById("menu");
    const playBtn = document.getElementById("playBtn");
    const closeBtn = document.getElementById("closeBtn");
    const hudEl = document.getElementById("hud");
    const killsEl = document.getElementById("kills");
    const pauseBtn = document.getElementById("pauseBtn");
    const pauseOverlay = document.getElementById("pauseOverlay");
    const resumeBtn = document.getElementById("resumeBtn");
    const restartBtn = document.getElementById("restartBtn");

    const faceImg = new Image();
    faceImg.src = "face.png";
    let faceReady = false;
    faceImg.onload = () => { faceReady = true; };

    let audioCtx = null;
    function ensureAudio() {
      if (!audioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) audioCtx = new AudioCtx();
      }
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    }

    let killVariant = 0;
    function playKillSound() {
      ensureAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const mode = killVariant++ % 4;
      const out = audioCtx.createGain();
      out.gain.setValueAtTime(0.65, now);
      out.connect(audioCtx.destination);

      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = mode % 2 === 0 ? "sawtooth" : "square";
      osc.frequency.setValueAtTime(mode === 2 ? 780 : 560, now);
      osc.frequency.exponentialRampToValueAtTime(95, now + 0.26);
      g.gain.setValueAtTime(0.75, now);
      g.gain.exponentialRampToValueAtTime(0.01, now + 0.27);
      osc.connect(g);
      g.connect(out);
      osc.start(now);
      osc.stop(now + 0.27);
    }

    let width = 0, height = 0, dpr = 1;
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 3);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
    }
    window.addEventListener("resize", resize);
    resize();

    function getBedLayout() {
      const bedW = Math.min(265, width * 0.64);
      const bedH = 120;
      return { x: Math.max(20, width * 0.12), y: height - bedH - 85, w: bedW, h: bedH };
    }
    function getShooterOrigin() {
      const bed = getBedLayout();
      return { x: bed.x + bed.w * 0.56, y: bed.y + bed.h * 0.50 };
    }

    let gameState = "menu", kills = 0, aiming = false;
    let aimPoint = { x: width * 0.52, y: height * 0.62 };
    let aimAngle = -Math.PI * 0.45;
    let beams = [], mosquitoes = [], particles = [], spawnTimer = 0;

    function spawnMosquito() {
      const fromLeft = Math.random() < 0.5;
      const startX = fromLeft ? -35 : width + 35;
      const startY = 105 + Math.random() * Math.max(70, height * 0.36);
      const speedX = (fromLeft ? 1 : -1) * (1.35 + Math.random() * 1.45);
      mosquitoes.push({
        x: startX,
        y: startY,
        baseY: startY,
        vx: speedX,
        vy: (Math.random() - 0.5) * 0.7,
        radius: 26,
        wingPhase: Math.random() * Math.PI * 2,
        age: 0,
        exiting: false
      });
    }

    function resetGame() {
      kills = 0; killsEl.textContent = "0"; aiming = false;
      const o = getShooterOrigin();
      aimPoint = { x: o.x + 10, y: o.y - 110 };
      aimAngle = Math.atan2(aimPoint.y - o.y, aimPoint.x - o.x);
      beams = []; mosquitoes = []; particles = []; spawnTimer = 0;
      spawnMosquito();
    }

    function openMenu() {
      gameState = "menu"; aiming = false;
      pauseOverlay.style.display = "none"; hudEl.style.display = "none";
      closeBtn.style.display = "none"; pauseBtn.style.display = "none"; menuEl.style.display = "flex";
    }

    playBtn.addEventListener("click", () => {
      ensureAudio(); menuEl.style.display = "none"; hudEl.style.display = "flex";
      closeBtn.style.display = "block"; pauseBtn.style.display = "block";
      pauseOverlay.style.display = "none"; gameState = "playing"; resetGame();
    });
    closeBtn.addEventListener("click", openMenu);
    pauseBtn.addEventListener("click", () => { if (gameState === "playing") { gameState = "paused"; aiming = false; pauseOverlay.style.display = "flex"; } });
    resumeBtn.addEventListener("click", () => { pauseOverlay.style.display = "none"; gameState = "playing"; });
    restartBtn.addEventListener("click", () => { pauseOverlay.style.display = "none"; gameState = "playing"; resetGame(); });

    function updateAim(clientX, clientY) {
      aimPoint = { x: clientX, y: clientY };
      const o = getShooterOrigin();
      aimAngle = Math.atan2(clientY - o.y, clientX - o.x);
    }
    function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
      const l2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
      if (l2 === 0) return Math.hypot(px - x1, py - y1);
      const t = Math.max(0, Math.min(1, ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2));
      return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
    }
    function killMosquito(index) {
      const m = mosquitoes[index];
      mosquitoes.splice(index, 1);
      kills += 1;
      killsEl.textContent = String(kills);
      playKillSound();
      for (let k = 0; k < 14; k++) {
        const ang = (Math.PI * 2 * k) / 14;
        const spd = 2 + Math.random() * 4;
        particles.push({ x: m.x, y: m.y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, life: 1, color: k % 2 === 0 ? "#ef4444" : "#ffd400" });
      }
    }
    function fireBeam() {
      const o = getShooterOrigin();
      const len = Math.hypot(width, height) * 1.4;
      const endX = o.x + Math.cos(aimAngle) * len;
      const endY = o.y + Math.sin(aimAngle) * len;
      beams.push({ x1: o.x, y1: o.y, x2: endX, y2: endY, alpha: 1 });
      for (let i = mosquitoes.length - 1; i >= 0; i--) {
        if (pointToSegmentDistance(mosquitoes[i].x, mosquitoes[i].y, o.x, o.y, endX, endY) <= mosquitoes[i].radius + 16) {
          killMosquito(i);
        }
      }
    }

    canvas.addEventListener("pointerdown", (e) => { if (gameState === "playing") { ensureAudio(); aiming = true; updateAim(e.clientX, e.clientY); } });
    canvas.addEventListener("pointermove", (e) => { if (aiming && gameState === "playing") updateAim(e.clientX, e.clientY); });
    window.addEventListener("pointerup", () => { if (aiming && gameState === "playing") { aiming = false; fireBeam(); } });

    function drawBedAndStickman() {
      const bed = getBedLayout();
      ctx.save();
      ctx.lineJoin = "round"; ctx.lineCap = "round"; ctx.strokeStyle = "#111"; ctx.lineWidth = 3.5;

      // Headboard & bed frame (matching 2nd photo style)
      ctx.fillStyle = "#5b5d62";
      ctx.beginPath(); ctx.moveTo(bed.x, bed.y - 26); ctx.lineTo(bed.x + 24, bed.y - 34);
      ctx.lineTo(bed.x + 24, bed.y + bed.h - 24); ctx.lineTo(bed.x, bed.y + bed.h - 14); ctx.closePath(); ctx.fill(); ctx.stroke();

      ctx.fillStyle = "#9ea3ad";
      ctx.beginPath(); ctx.moveTo(bed.x + 12, bed.y + 18); ctx.lineTo(bed.x + bed.w, bed.y - 10);
      ctx.lineTo(bed.x + bed.w, bed.y + bed.h - 28); ctx.lineTo(bed.x + 12, bed.y + bed.h - 4); ctx.closePath(); ctx.fill(); ctx.stroke();

      ctx.fillStyle = "#4d5958";
      ctx.beginPath(); ctx.moveTo(bed.x + 66, bed.y + 34); ctx.lineTo(bed.x + bed.w - 4, bed.y + 10);
      ctx.lineTo(bed.x + bed.w - 4, bed.y + bed.h - 28); ctx.lineTo(bed.x + 56, bed.y + bed.h - 12); ctx.closePath(); ctx.fill(); ctx.stroke();

      ctx.fillStyle = "#222";
      ctx.fillRect(bed.x + 16, bed.y + bed.h - 10, 12, 18);
      ctx.fillRect(bed.x + bed.w - 26, bed.y + bed.h - 28, 12, 18);

      // Stickman body & stretched legs on bed
      const neckX = bed.x + 68, neckY = bed.y + 26, hipX = bed.x + bed.w * 0.56, hipY = bed.y + bed.h * 0.48;
      ctx.lineWidth = 4.5;
      ctx.beginPath();
      ctx.moveTo(neckX, neckY); ctx.lineTo(hipX, hipY);
      ctx.moveTo(hipX, hipY); ctx.lineTo(bed.x + bed.w - 34, bed.y + bed.h - 28);
      ctx.moveTo(hipX + 6, hipY + 3); ctx.lineTo(bed.x + bed.w - 22, bed.y + bed.h - 24);
      ctx.moveTo(neckX + 8, neckY + 4); ctx.lineTo(neckX + 8 + Math.cos(aimAngle) * 28, neckY + 4 + Math.sin(aimAngle) * 28);
      ctx.stroke();

      // Face on bed head (2nd photo placement)
      if (faceReady) {
        const aspect = faceImg.naturalWidth && faceImg.naturalHeight ? faceImg.naturalWidth / faceImg.naturalHeight : 1;
        const headH = 56, headW = Math.min(64, Math.max(44, headH * aspect)), headX = bed.x + 25, headY = bed.y - 25;
        ctx.save();
        ctx.beginPath(); ctx.ellipse(headX + headW * 0.5, headY + headH * 0.5, headW * 0.52, headH * 0.52, -0.15, 0, Math.PI * 2); ctx.clip();
        ctx.drawImage(faceImg, headX, headY, headW, headH);
        ctx.restore();
        ctx.beginPath(); ctx.ellipse(headX + headW * 0.5, headY + headH * 0.5, headW * 0.52, headH * 0.52, -0.15, 0, Math.PI * 2);
        ctx.lineWidth = 2.5; ctx.stroke();
      }
      ctx.restore();
    }

    function drawSmartAimPoints() {
      const o = getShooterOrigin();
      const totalDist = Math.hypot(width, height) * 1.3;
      const dirX = Math.cos(aimAngle);
      const dirY = Math.sin(aimAngle);
      const endX = o.x + dirX * totalDist;
      const endY = o.y + dirY * totalDist;

      ctx.save();
      ctx.strokeStyle = "#222";
      ctx.lineWidth = 3;
      ctx.setLineDash([10, 9]);
      ctx.beginPath();
      ctx.moveTo(o.x, o.y);
      ctx.lineTo(endX, endY);
      ctx.stroke();
      ctx.setLineDash([]);

      // Aim guide dots along trajectory
      for (let d = 58; d < Math.min(totalDist, Math.max(width, height)); d += 56) {
        ctx.beginPath();
        ctx.arc(o.x + dirX * d, o.y + dirY * d, 3.8, 0, Math.PI * 2);
        ctx.fillStyle = "#111";
        ctx.fill();
      }

      // Active aim ring + center point
      ctx.beginPath();
      ctx.arc(aimPoint.x, aimPoint.y, 17, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(180, 185, 195, 0.45)";
      ctx.fill();
      ctx.lineWidth = 2.2;
      ctx.strokeStyle = "rgba(95, 100, 110, 0.85)";
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(aimPoint.x, aimPoint.y, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = "#111";
      ctx.fill();
      ctx.restore();
    }

    function drawBeams() {
      for (let i = beams.length - 1; i >= 0; i--) {
        const b = beams[i];
        ctx.save(); ctx.globalAlpha = b.alpha; ctx.strokeStyle = "#ff3b00"; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke(); ctx.restore();
        b.alpha -= 0.09; if (b.alpha <= 0) beams.splice(i, 1);
      }
    }

    function drawMosquitoes() {
      for (const m of mosquitoes) {
        m.wingPhase += 0.45;
        const flap = Math.sin(m.wingPhase) * 6;
        ctx.save(); ctx.translate(m.x, m.y);
        ctx.fillStyle = "rgba(210, 225, 245, 0.9)"; ctx.strokeStyle = "#555"; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.ellipse(-6, -12 + flap * 0.35, 12, 5, -0.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(5, -13 - flap * 0.35, 11, 5, 0.45, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = "#222"; ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.moveTo(-4, 6); ctx.lineTo(-14, 18); ctx.moveTo(2, 6); ctx.lineTo(0, 20); ctx.moveTo(7, 5); ctx.lineTo(16, 17); ctx.stroke();
        ctx.fillStyle = "#222"; ctx.beginPath(); ctx.ellipse(4, 0, 10, 7, 0.1, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#e11d48"; ctx.beginPath(); ctx.ellipse(-8, 1, 10, 7, -0.1, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(10, -2, 3.2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(11, -2, 1.5, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#111"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(14, 1); ctx.lineTo(23, 5); ctx.stroke();
        ctx.restore();
      }
    }

    function drawParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        ctx.save(); ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        p.x += p.vx; p.y += p.vy; p.life -= 0.04; if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function loop() {
      ctx.clearRect(0, 0, width, height);
      if (gameState === "playing") {
        spawnTimer += 1;
        if (spawnTimer > 95 && mosquitoes.length < 4) { spawnTimer = 0; spawnMosquito(); }

        for (let i = mosquitoes.length - 1; i >= 0; i--) {
          const m = mosquitoes[i];
          m.age += 1;
          m.x += m.vx;
          m.y = m.baseY + Math.sin(m.age * 0.05) * 26;

          if (m.age > 340 && !m.exiting) {
            m.exiting = true;
            m.vx = (m.x < width * 0.5 ? -1 : 1) * (2.2 + Math.random() * 1.2);
          }

          if (m.x < -70 || m.x > width + 70) {
            mosquitoes.splice(i, 1);
          }
        }
      }
      if (gameState !== "menu") { drawSmartAimPoints(); drawBeams(); drawMosquitoes(); drawParticles(); drawBedAndStickman(); }
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
