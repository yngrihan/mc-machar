<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MC MACHAR - Endless Stick Shooter</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
    body {
      margin: 0;
      background: #141414;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    .phone-frame {
      position: relative;
      width: 100vw;
      max-width: 420px;
      height: 100vh;
      max-height: 820px;
      background: #ffffff;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    }
    canvas { display: block; width: 100%; height: 100%; }

    #menuScreen {
      position: absolute;
      inset: 0;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 28px 20px 24px;
      z-index: 10;
    }
    .top-stick-area {
      position: relative;
      width: 240px;
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }
    .bubble {
      position: absolute;
      top: 6px;
      left: -10px;
      background: #fff;
      border: 2.5px solid #111;
      border-radius: 16px;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 900;
      text-align: center;
      max-width: 125px;
      line-height: 1.25;
    }
    .title-wrap { text-align: center; }
    .game-title {
      margin: 0;
      font-size: 46px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #111;
      line-height: 1;
    }
    .sub-title {
      margin-top: 8px;
      font-size: 12px;
      letter-spacing: 5px;
      color: #444;
      font-weight: 700;
    }
    .play-btn {
      background: #ffd426;
      color: #111;
      border: 3px solid #111;
      border-radius: 999px;
      padding: 14px 44px;
      font-size: 22px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 0 #111;
    }
    .play-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #111; }

    .rules-box {
      width: 100%;
      border: 2px dashed #e06c6c;
      border-radius: 14px;
      padding: 12px 14px;
      background: #fffafa;
      font-size: 12px;
      color: #222;
      line-height: 1.5;
    }
    .rules-box p { margin: 6px 0; font-weight: 600; }

    #hud {
      position: absolute;
      top: 18px;
      left: 0;
      right: 0;
      display: none;
      justify-content: center;
      align-items: flex-start;
      pointer-events: none;
      z-index: 5;
    }
    .score-box { text-align: center; }
    #scoreVal { font-size: 42px; font-weight: 900; color: #111; line-height: 1; }
    .score-lbl { font-size: 11px; font-weight: 800; color: #555; letter-spacing: 1px; }
    #pauseBtn {
      position: absolute;
      right: 16px;
      top: 4px;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      border: 2.5px solid #111;
      background: #fff;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      pointer-events: auto;
      box-shadow: 0 4px 0 #111;
    }

    #pauseModal {
      position: absolute;
      inset: 0;
      background: rgba(20, 20, 20, 0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 20;
    }
    .paused-text { color: #ffd426; font-size: 36px; font-weight: 900; letter-spacing: 2px; }
    .modal-btn {
      width: 210px;
      padding: 13px 20px;
      border-radius: 14px;
      border: 2.5px solid #111;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }
    .resume-btn { background: #ffd426; color: #111; }
    .menu-btn { background: #2c2c2c; color: #fff; border-color: #fff; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div id="menuScreen">
      <div class="top-stick-area">
        <div class="bubble">HILA HILA KY MAAR DOGAAAA!</div>
        <canvas id="menuStickCanvas" width="140" height="170"></canvas>
      </div>

      <div class="title-wrap">
        <h1 class="game-title">MC MACHAR</h1>
        <div class="sub-title">ENDLESS STICK SHOOTER</div>
      </div>

      <button class="play-btn" id="playBtn">▶ PLAY</button>

      <div class="rules-box">
        <p>🎯 Screen ko <b>HOLD</b> karein → aim line niklegi</p>
        <p>🔥 Hold/Release karein → <b>LASER</b> fire!</p>
        <p>⏸ Pause button se game ruk sakti hai</p>
      </div>
    </div>

    <div id="hud">
      <div class="score-box">
        <div id="scoreVal">0</div>
        <div class="score-lbl">TOTAL KILLS</div>
      </div>
      <button id="pauseBtn">❚❚</button>
    </div>

    <div id="pauseModal">
      <div class="paused-text">❚❚ PAUSED</div>
      <button class="modal-btn resume-btn" id="resumeBtn">▶ RESUME</button>
      <button class="modal-btn menu-btn" id="mainMenuBtn">🏠 MAIN MENU</button>
    </div>

    <canvas id="gameCanvas"></canvas>
  </div>

  <script>
    const USER_FACE_SRC = "face.png";

    const userFaceImg = new Image();
    let faceLoaded = false;
    if (USER_FACE_SRC) {
      userFaceImg.src = USER_FACE_SRC;
      userFaceImg.onload = () => { faceLoaded = true; };
    }

    function drawPlayerFace(ctx, x, y, radius) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();

      if (faceLoaded) {
        ctx.drawImage(userFaceImg, x - radius, y - radius, radius * 2, radius * 2);
      } else {
        ctx.fillStyle = "#f2c6a0";
        ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
        ctx.fillStyle = "#222";
        ctx.beginPath();
        ctx.arc(x - radius * 0.32, y - radius * 0.1, radius * 0.12, 0, Math.PI * 2);
        ctx.arc(x + radius * 0.32, y - radius * 0.1, radius * 0.12, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(x, y + radius * 0.25, radius * 0.35, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.stroke();
      }
      ctx.restore();

      ctx.strokeStyle = "#111";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.stroke();
    }

    const menuCanvas = document.getElementById("menuStickCanvas");
    const mctx = menuCanvas.getContext("2d");
    function drawMenuStickman() {
      mctx.clearRect(0, 0, menuCanvas.width, menuCanvas.height);
      mctx.strokeStyle = "#111";
      mctx.lineWidth = 4;
      mctx.lineCap = "round";

      mctx.beginPath();
      mctx.moveTo(70, 75);
      mctx.lineTo(70, 125);
      mctx.moveTo(40, 95);
      mctx.lineTo(100, 95);
      mctx.moveTo(70, 125);
      mctx.lineTo(50, 160);
      mctx.moveTo(70, 125);
      mctx.lineTo(90, 160);
      mctx.stroke();

      drawPlayerFace(mctx, 70, 46, 26);
    }
    drawMenuStickman();

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const menuScreen = document.getElementById("menuScreen");
    const hud = document.getElementById("hud");
    const pauseModal = document.getElementById("pauseModal");
    const scoreVal = document.getElementById("scoreVal");

    let W = 0, H = 0;
    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      W = canvas.width = rect.width;
      H = canvas.height = rect.height;
    }
    resize();
    window.addEventListener("resize", resize);

    let state = "MENU";
    let score = 0;
    let aiming = false;
    let aimAngle = -Math.PI / 2;
    let lasers = [];
    let machars = [];
    let spawnTimer = 0;

    function getShooterOrigin() {
      return { x: W * 0.52, y: H * 0.72 };
    }

    function spawnMachar() {
      const fromLeft = Math.random() < 0.5;
      machars.push({
        x: fromLeft ? -25 : W + 25,
        y: H * (0.16 + Math.random() * 0.34),
        vx: (fromLeft ? 1 : -1) * (1.5 + Math.random() * 1.8),
        phase: Math.random() * Math.PI * 2,
        r: 18
      });
    }

    function updateAim(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const px = clientX - rect.left;
      const py = clientY - rect.top;
      const orig = getShooterOrigin();
      let angle = Math.atan2(py - orig.y, px - orig.x);
      if (angle > -0.15) angle = -0.15;
      if (angle < -Math.PI + 0.15) angle = -Math.PI + 0.15;
      aimAngle = angle;
    }

    function fireLaser() {
      const orig = getShooterOrigin();
      lasers.push({
        x1: orig.x,
        y1: orig.y,
        x2: orig.x + Math.cos(aimAngle) * Math.max(W, H) * 1.5,
        y2: orig.y + Math.sin(aimAngle) * Math.max(W, H) * 1.5,
        life: 10
      });

      for (let i = machars.length - 1; i >= 0; i--) {
        const m = machars[i];
        const dist = pointToSegmentDist(m.x, m.y, orig.x, orig.y, orig.x + Math.cos(aimAngle) * 1500, orig.y + Math.sin(aimAngle) * 1500);
        if (dist <= m.r + 8) {
          machars.splice(i, 1);
          score++;
          scoreVal.textContent = score;
        }
      }
    }

    function pointToSegmentDist(px, py, x1, y1, x2, y2) {
      const l2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
      if (l2 === 0) return Math.hypot(px - x1, py - y1);
      let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
    }

    canvas.addEventListener("pointerdown", (e) => {
      if (state !== "PLAYING") return;
      aiming = true;
      updateAim(e.clientX, e.clientY);
    });

    canvas.addEventListener("pointermove", (e) => {
      if (state !== "PLAYING" || !aiming) return;
      updateAim(e.clientX, e.clientY);
    });

    window.addEventListener("pointerup", () => {
      if (state !== "PLAYING" || !aiming) return;
      aiming = false;
      fireLaser();
    });

    document.getElementById("playBtn").addEventListener("click", () => {
      score = 0;
      scoreVal.textContent = "0";
      machars = [];
      lasers = [];
      spawnMachar();
      state = "PLAYING";
      menuScreen.style.display = "none";
      hud.style.display = "flex";
      pauseModal.style.display = "none";
    });

    document.getElementById("pauseBtn").addEventListener("click", () => {
      if (state !== "PLAYING") return;
      state = "PAUSED";
      aiming = false;
      pauseModal.style.display = "flex";
    });

    document.getElementById("resumeBtn").addEventListener("click", () => {
      if (state !== "PAUSED") return;
      state = "PLAYING";
      pauseModal.style.display = "none";
    });

    document.getElementById("mainMenuBtn").addEventListener("click", () => {
      state = "MENU";
      aiming = false;
      pauseModal.style.display = "none";
      hud.style.display = "none";
      menuScreen.style.display = "flex";
      drawMenuStickman();
    });

    function drawBedAndPlayer() {
      const bedX = W * 0.14;
      const bedY = H * 0.68;
      const bedW = W * 0.66;
      const bedH = H * 0.14;

      ctx.fillStyle = "#d9d9d9";
      ctx.strokeStyle = "#111";
      ctx.lineWidth = 3;
      ctx.fillRect(bedX, bedY, bedW, bedH);
      ctx.strokeRect(bedX, bedY, bedW, bedH);

      ctx.fillStyle = "#333";
      ctx.fillRect(bedX, bedY - 36, 14, bedH + 36);
      ctx.fillRect(bedX + 6, bedY + bedH, 10, 18);
      ctx.fillRect(bedX + bedW - 16, bedY + bedH, 10, 18);

      ctx.fillStyle = "#3f5959";
      ctx.fillRect(bedX + 55, bedY + 12, bedW - 70, bedH - 16);
      ctx.strokeRect(bedX + 55, bedY + 12, bedW - 70, bedH - 16);

      ctx.strokeStyle = "#111";
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(bedX + 52, bedY + 28);
      ctx.lineTo(bedX + bedW - 22, bedY + 38);
      ctx.stroke();

      drawPlayerFace(ctx, bedX + 36, bedY + 20, 22);
    }

    function drawMachar(m) {
      ctx.save();
      ctx.translate(m.x, m.y);

      const flap = Math.sin(m.phase) * 0.5;
      ctx.fillStyle = "rgba(180, 220, 255, 0.85)";
      ctx.strokeStyle = "#333";
      ctx.lineWidth = 1.5;

      ctx.save();
      ctx.rotate(-0.5 + flap);
      ctx.beginPath();
      ctx.ellipse(-4, -12, 12, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.rotate(0.5 - flap);
      ctx.beginPath();
      ctx.ellipse(4, -12, 12, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = "#b8292f";
      ctx.beginPath();
      ctx.ellipse(0, 0, 12, 7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-4, 5); ctx.lineTo(-10, 15);
      ctx.moveTo(2, 6); ctx.lineTo(4, 16);
      ctx.moveTo(7, 5); ctx.lineTo(14, 14);
      ctx.stroke();

      ctx.restore();
    }

    function loop() {
      ctx.clearRect(0, 0, W, H);

      if (state === "PLAYING" || state === "PAUSED") {
        drawBedAndPlayer();

        if (state === "PLAYING") {
          spawnTimer++;
          if (spawnTimer > 75 && machars.length < 4) {
            spawnMachar();
            spawnTimer = 0;
          }
          for (let i = machars.length - 1; i >= 0; i--) {
            const m = machars[i];
            m.x += m.vx;
            m.phase += 0.45;
            m.y += Math.sin(m.phase * 0.25) * 0.8;
            if (m.x < -50 || m.x > W + 50) {
              machars.splice(i, 1);
            }
          }
        }

        machars.forEach(drawMachar);

        if (aiming) {
          const orig = getShooterOrigin();
          const endX = orig.x + Math.cos(aimAngle) * Math.max(W, H) * 1.4;
          const endY = orig.y + Math.sin(aimAngle) * Math.max(W, H) * 1.4;

          ctx.save();
          ctx.setLineDash([10, 8]);
          ctx.lineWidth = 3;
          ctx.strokeStyle = "#111";
          ctx.beginPath();
          ctx.moveTo(orig.x, orig.y);
          ctx.lineTo(endX, endY);
          ctx.stroke();
          ctx.setLineDash([]);

          const ringX = orig.x + Math.cos(aimAngle) * 95;
          const ringY = orig.y + Math.sin(aimAngle) * 95;
          ctx.beginPath();
          ctx.arc(ringX, ringY, 14, 0, Math.PI * 2);
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 2.5;
          ctx.stroke();
          ctx.restore();
        }

        for (let i = lasers.length - 1; i >= 0; i--) {
          const l = lasers[i];
          ctx.save();
          ctx.strokeStyle = "rgba(255, 90, 30, 0.9)";
          ctx.lineWidth = 6 * (l.life / 10);
          ctx.beginPath();
          ctx.moveTo(l.x1, l.y1);
          ctx.lineTo(l.x2, l.y2);
          ctx.stroke();
          ctx.restore();

          l.life--;
          if (l.life <= 0) lasers.splice(i, 1);
        }
      }

      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
